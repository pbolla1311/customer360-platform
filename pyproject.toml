[project]
name = "customer360-platform"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.39.0",
    "pandas>=2.2.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "confluent-kafka>=2.11.0",
    "prometheus-client>=0.22.1",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests requiring external services such as Kafka or PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["customer360*"]
exclude = [
    "apps*",
    "airflow*",
]

[tool.setuptools.package-data]
customer360 = ["api/static/swagger/*", "api/static/redoc/*"]