name: Tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: customer360
          POSTGRES_PASSWORD: customer360
          POSTGRES_DB: customer360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U customer360 -d customer360_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: apache/kafka:4.0.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports:
          - 9092:9092

    env:
      DATABASE_URL: postgresql+psycopg://customer360:customer360@localhost:5432/customer360_test
      PYTHONPATH: .
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_TOPIC: customer360.customer-events.v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Wait for Kafka
        run: |
          for attempt in {1..30}; do
            if nc -z localhost 9092; then
              echo "Kafka is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Kafka failed to start"
          exit 1

      - name: Run Alembic migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -v