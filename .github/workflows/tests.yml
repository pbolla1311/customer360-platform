name: Tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: customer360
          POSTGRES_PASSWORD: customer360
          POSTGRES_DB: customer360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U customer360 -d customer360_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://customer360:customer360@localhost:5432/customer360_test
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run Alembic migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -v